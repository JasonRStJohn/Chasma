services:
  chasma-online:
    build:
      context: ..
      dockerfile: online/Dockerfile
    image: chasma-online:latest
    container_name: chasma-online
    restart: unless-stopped
    ports:
      # Bound to 9999 on the host so NGINX Proxy Manager can proxy to 8080
      - "0.0.0.0:9999:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - CHASMA_LOG_DIR=/app/logs
    volumes:
      # Persistent activity log (joins/leaves, room lifecycle, errors, heartbeats).
      # Bind-mounted so it survives `up --build` and container recreation, which
      # wipe `docker logs`. activity.log rotates at 5 MB x 5; faults.log catches
      # native crashes (segfaults) that Python itself cannot log.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Optional: If your NGINX Proxy runs in a shared Docker network on the Mac mini,
    # uncomment the networks block below to connect `chasma-online` directly by container name:
    # networks:
    #   - nginx-proxy

# networks:
#   nginx-proxy:
#     external: true
