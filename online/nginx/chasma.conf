# NGINX Reverse Proxy Configuration for Chasma Online
# Place in /etc/nginx/conf.d/chasma.conf or /opt/homebrew/etc/nginx/servers/chasma.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name chasma.yourdomain.com; # <-- Replace with your Cloudflare Tunnel hostname

    # Disable Nagle's algorithm so 60Hz WebSocket packets are flushed immediately
    tcp_nodelay on;

    # 1. Real-Time 60Hz WebSocket Endpoint (/ws/{room_code})
    location /ws/ {
        proxy_pass http://127.0.0.1:8080; # Or http://chasma-online:8080 if NGINX is in the same Docker network
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward Client Identity from Cloudflare Tunnel -> NGINX -> FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for low-latency 60Hz game loops: disable proxy buffering & extend idle timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. REST API & Vue 3 SPA Static Assets
    location / {
        proxy_pass http://127.0.0.1:8080; # Or http://chasma-online:8080
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
